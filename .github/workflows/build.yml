name: Build STM32 Firmware

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # zum Aktualisieren des Releases "latest"

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GCC and tools
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-none-eabi cmake make

    - name: Build firmware
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../arm-none-eabi.cmake
        make

    - name: Create binary files
      run: |
        arm-none-eabi-objcopy \
          -O binary \
          build/firmware.elf \
          firmware.bin

        arm-none-eabi-objcopy \
          -O ihex \
          build/firmware.elf \
          firmware.hex

    - name: Upload firmware files
      uses: actions/upload-artifact@v4
      with:
        name: STM32L152RE-Firmware
        path: |
          firmware.bin
          firmware.hex

    # Festes Release "latest": firmware.bin ungepackt unter immer gleicher URL
    # https://github.com/<owner>/<repo>/releases/download/latest/firmware.bin
    - name: Publish firmware to release "latest"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git tag -f latest
        git push -f origin refs/tags/latest
        gh release view latest >/dev/null 2>&1 || \
          gh release create latest --title "Aktuelle Firmware" --notes "" --latest
        gh release upload latest firmware.bin firmware.hex --clobber
        gh release edit latest --latest \
          --notes "Automatisch gebaut aus ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))"

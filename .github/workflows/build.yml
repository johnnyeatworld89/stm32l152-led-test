name: Build STM32 Firmware

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install ARM GCC and tools
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-none-eabi cmake make

    - name: Build firmware
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../arm-none-eabi.cmake
        make

    - name: Create binary files
      run: |
        arm-none-eabi-objcopy \
          -O binary \
          build/firmware.elf \
          firmware.bin

        arm-none-eabi-objcopy \
          -O ihex \
          build/firmware.elf \
          firmware.hex

    - name: Upload firmware files
      uses: actions/upload-artifact@v4
      with:
        name: STM32L152RE-Firmware
        path: |
          firmware.bin
          firmware.hex

name: Build STM32 Firmware

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install ARM GCC
      run: |
        sudo apt update
        sudo apt install -y gcc-arm-none-eabi cmake make

        - name: Build
  run: |
    mkdir build
    cd build
    cmake .. -DCMAKE_TOOLCHAIN_FILE=../arm-none-eabi.cmake
    make

    - name: Create BIN HEX
      run: |
        arm-none-eabi-objcopy -O binary build/firmware.elf firmware.bin
        arm-none-eabi-objcopy -O ihex build/firmware.elf firmware.hex

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: STM32-Firmware
        path: |
          firmware.bin
          firmware.hex
